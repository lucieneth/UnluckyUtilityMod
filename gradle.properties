# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
# Local/dev version. Real release versions come from git tags (v1.1 etc.) via CI.
mod_version=dev
maven_group=unlucky.utility

# Dependencies
fabric_api_version=0.161.0+26.3

# Optional soft dependencies (compile-only, never bundled). The Printer module
# reads Litematica's schematic world when the player has these installed.
#
# Still the 26.2 pair: Litematica has no 26.3 build yet (MaLiLib does, 0.30.0, but
# the two ship as a set and Litematica is the one we compile against). The 26.2 jars
# still resolve every symbol we reference under 26.3, so the Printer compiles; at
# runtime Litematica simply will not load on 26.3 and LitematicaBridge no-ops, which
# is what it exists for. Bump both together once Litematica ships 26.3.
litematica_version=0.28.4
malilib_version=0.29.3

# Sodium, pulled in only by `-PwithSodium` for the second gametest job. Stable, never
# an alpha: this run exists to tell a real breakage from a missing mod, and an alpha
# that changes under us turns that signal into noise.
sodium_version=mc26.3-0.9.2-fabric
