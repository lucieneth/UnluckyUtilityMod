# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  # Boots a real client twice over (src/gametest): ScreenSmokeTest opens every one of
  # our screens with no world and then inside one, and ModuleSmokeTest enables all 94
  # modules in a world — one at a time, then together — while frames render. Ten of the
  # eleven crashes we logged up to v2.0 were a screen throwing while rendering, so this
  # is the job that earns its keep, and the module sweep is what makes a version bump
  # cheap: a hook that stops applying is silent until someone toggles the module.
  # Needs a display and a driver. Loom provides the display: whenever CI is set it runs the
  # client under its own xvfb-run. The driver is Vulkan, through mesa's lavapipe — 26.3's
  # OpenGL backend finds no GLX visual under Xvfb (8- or 24-bit), and without a Vulkan
  # fallback the game stops on a "no graphics backend" message box that nobody clicks. This
  # is how Fabric API's own client tests run on 26.3. OpenGL stays covered by local runs.
  #
  # Runs twice. The sodium leg is the only thing that ever checks the three Sodium mixins:
  # they name their targets as *strings*, so nothing in an ordinary build checks them, and on the
  # vanilla leg MixinAudit reports them "target absent" — correct, and indistinguishable from
  # Sodium having renamed the class. With Sodium loaded every target must resolve.
  # fail-fast is off so a break in one leg never hides the other.
  client-gametest:
    name: client-gametest (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # ~5 minutes when healthy. A client that cannot open a window waits on a message box
    # forever, so the cap is what turns that into a failure.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vanilla
            flags: ''
          - name: sodium
            flags: '-PwithSodium'
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: install virtual display and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: run client gametest
        run: ./gradlew runClientGameTest ${{ matrix.flags }}
      # cancelled() too: a hang ends in a timeout cancel, and that is when the log matters.
      - name: capture logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-logs-${{ matrix.name }}
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
          if-no-files-found: ignore
